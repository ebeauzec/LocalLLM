# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3100;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Proxy Ollama API (stripping /ollama/ prefix)
    location ^~ /ollama/ {
        proxy_pass http://ollama:11434/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy LiteLLM API (spend tracking, model info)
    location ^~ /litellm/ {
        proxy_pass http://litellm:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Open WebUI Proxy (all routes with trusted email header) ──

    # API routes
    location ^~ /api/ {
        proxy_pass http://open-webui:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Email "admin@localllm.local";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SvelteKit assets
    location ^~ /_app/ {
        proxy_pass http://open-webui:8080/_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Email "admin@localllm.local";
    }

    # Static assets
    location ^~ /static/ {
        proxy_pass http://open-webui:8080/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Email "admin@localllm.local";
    }

    # WebSocket
    location ^~ /ws {
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Email "admin@localllm.local";
    }

    # Chat pages — proxy directly to Open WebUI with auto-auth
    location ^~ /chat {
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Auth-Email "admin@localllm.local";
    }

    # Auto-login page — signs in and redirects to /chat
    location ^~ /auth {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>LocalLLM</title>
<style>body{background:#0a0a0f;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Inter,system-ui,sans-serif;color:#94a3b8}
.box{text-align:center;max-width:500px}.spinner{width:40px;height:40px;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}#log{text-align:left;font-size:12px;font-family:monospace;margin-top:16px;line-height:1.6}.ok{color:#22c55e}.err{color:#f87171}.warn{color:#f59e0b}</style></head>
<body><div class="box"><div class="spinner"></div><div id="log"></div></div>
<script>
const log=document.getElementById("log");
function l(msg,cls){log.innerHTML+="<div class=\""+(cls||"")+"\">"+msg+"</div>";}
(async()=>{
  l("Calling /api/v1/auths/signin...");
  try{
    const r=await fetch("/api/v1/auths/signin",{method:"POST",credentials:"include",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:"admin@localllm.local",password:"localllm-admin"})});
    l("Response: "+r.status+(r.ok?" OK":" FAILED"), r.ok?"ok":"err");
    if(!r.ok){l("Auth failed. Status: "+r.status,"err");return;}
    const d=await r.json();
    l("User: "+d.name+" ("+d.email+")","ok");
    l("Token: "+d.token.substring(0,30)+"...");
    localStorage.setItem("token",d.token);
    l("localStorage.token SET","ok");
    document.cookie="token="+d.token+";path=/;max-age=2419200;samesite=lax";
    l("document.cookie SET","ok");
    l("Verifying auth...");
    const v=await fetch("/api/v1/auths/",{credentials:"include"});
    l("Verify: "+v.status, v.ok?"ok":"err");
    if(v.ok){
      l("Redirecting to /chat in 1s...","ok");
      setTimeout(()=>{window.location.replace("/chat");},1000);
    } else {
      l("Auth verification failed! Cookie may not be stored.","err");
      l("Try: clear cookies for localhost and retry.","warn");
    }
  }catch(e){l("Error: "+e.message,"err");}
})();
</script></body></html>';
    }

    # Proxy Open WebUI root
    location = /webui {
        return 302 /chat;
    }

    # Default — serve dashboard static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
