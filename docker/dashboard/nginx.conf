# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3100;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # ── Dashboard static assets (served directly) ──
    location ^~ /dashboard/js/ {
        alias /usr/share/nginx/html/js/;
    }
    location ^~ /dashboard/css/ {
        alias /usr/share/nginx/html/css/;
    }
    location ^~ /dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /dashboard/index.html;
    }
    location = /dashboard {
        return 302 /dashboard/;
    }

    # ── Proxy APIs ──

    # Ollama API (stripping /ollama/ prefix)
    location ^~ /ollama/ {
        proxy_pass http://ollama:11434/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiteLLM API (spend tracking, model info)
    location ^~ /litellm/ {
        proxy_pass http://litellm:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Auto-login page ──
    location = /auth {
        alias /usr/share/nginx/html/auth.html;
        default_type text/html;
    }

    # ── Open WebUI (everything else proxied) ──
    # Injects the global footer script into every HTML page
    location / {
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        # Inject global footer into HTML pages
        sub_filter '</body>' '<script src="/dashboard/js/footer.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
